# Safety review (I6, D41): a card that touches a safety-vocabulary topic carries `safety: [tag]`, like a
# table entry; drawMove never draws a card behind a Line. All 24 moves were audited one by one.
# Seven are tagged on doubt (violence, death twice, fire, war, religion, police); the other 17 stay
# abstract. Every move is a stage direction the GM can use in one breath, and every one fails
# forward: something changes, nothing stalls. Original wording (CC-BY-4.0).
kind: deck
id: core.gm-moves
title: GM moves
cards:
  - id: core.move.threat-steps-closer
    text: Let the danger take its next step
    prompt: What changed while nobody was watching?
  - id: core.move.name-the-price
    text: State the cost, then let them decide
    prompt: What will this cost, and who collects it?
  - id: core.move.split-the-path
    text: Force a choice between two goods
    prompt: "Which two things can't both be saved?"
  - id: core.move.rival-gains
    text: Hand the prize to someone else
    prompt: Who just won something, and how will the party find out?
  - id: core.move.shift-the-ground
    text: Change something they took for granted
    prompt: What about this place is no longer true?
  - id: core.move.quiet-voice
    text: Bring a background face forward
    prompt: Who has been standing at the edge of the scene, and what do they finally say?
  - id: core.move.yes-with-strings
    text: Say yes, but tie it to something
    prompt: They get what they reached for, so what comes along with it?
  - id: core.move.thread-surfaces
    text: Spill a hidden fact into the open
    prompt: Which secret could surface right now, and who sees it first?
  - id: core.move.paint-the-pause
    text: Pause on a detail that changes the mood
    prompt: What do they notice that shifts how the scene feels?
  - id: core.move.quiet-promise
    text: Let a quiet promise come due
    prompt: Who made a small promise nobody wrote down, and who remembers it?
  - id: core.move.reason-to-bargain
    text: Give the opposition a reason to bargain
    prompt: What do they want badly enough to sit down and talk?
  - id: core.move.loyalties-at-odds
    text: Put two loyalties at odds
    prompt: Whom does each character owe, and can both be kept?
  - id: core.move.cost-of-a-win
    text: Show the cost of an earlier win
    prompt: "What did last session's victory break without anyone noticing?"
  - id: core.move.news-too-late
    text: Let good news arrive too late
    prompt: Who hears it after it stopped helping, and what do they do?
    safety: [death]
  - id: core.move.wrong-helper
    text: Offer help from the wrong person
    prompt: Who steps forward that nobody would have chosen?
  - id: core.move.time-shrinks
    text: Shorten the time they thought they had
    prompt: What date moved closer, and who moved it?
  - id: core.move.party-pulled-apart
    text: Pull the group in two directions
    prompt: Which two needs arrive at once, and who answers which?
  - id: core.move.stranger-knows-them
    text: Have a stranger greet them by name
    prompt: What does this stranger know, and who told them?
  - id: core.move.quarrel-turns-physical
    text: Turn a quarrel physical
    prompt: Who throws the first shove, and who steps between?
    safety: [violence]
  - id: core.move.old-grief-resurfaces
    text: Stir up an old grief
    prompt: Who is still mourning here, and what sets it off?
    safety: [death]
  - id: core.move.small-fire-spreads
    text: Set a small fire loose
    prompt: What is burning, and who smells it first?
    safety: [fire]
  - id: core.move.border-turns-hostile
    text: Sour a border dispute into hostility
    prompt: Which side blinked first, and who saw it?
    safety: [war]
  - id: core.move.oath-gets-expensive
    text: Make a sworn oath expensive
    prompt: Who swore it, and who holds them to it?
    safety: [religion]
  - id: core.move.watch-takes-notice
    text: "Draw the watch's attention"
    prompt: What did the watch notice, and who gets blamed?
    safety: [police]
