title: 'As time goes on,'
tags: []
entries:
  - text: a second sign of it appears, far from where anyone was looking
  - text: the cause turns out to be older than anyone assumed
  - text: the cost starts to land on people who had nothing to do with it
  - text: someone who has been profiting from it grows frightened and tries to stop
  - text: a competing cause of the same trouble appears, and the two collide
  - text: it eases for a week, which is when it is most dangerous
  - text: whoever explained it at the start stops mentioning it
  - text: someone who dismissed it at the start asks for help in private
  - text: it spreads to the next settlement over
  - text: it turns out to have an unannounced cut-off date
  - text: the people behind it fall out, and one looks for a buyer for what they know
  - text: the first real benefit appears, and a loyal group forms to defend it
  - text: it moves out of reach, and the effects stay
  - text: someone comes forward with proof, to a very cold reception
  - text: the one person who understood it leaves the settlement
  - text: it is much larger than it looked, and part of it is already finished elsewhere
  - text: the loudest critic turns out to have been right for the wrong reasons
  - text: the people most affected start organising, with demands of their own
  - text: an outsider arrives to take advantage of it
  - text: a death is blamed on something else
