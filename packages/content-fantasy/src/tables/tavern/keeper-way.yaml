kind: table
id: fantasy.tavern.keeper-way
title: The keeper
tags: [tavern]
entries:
  - text: greets every customer by the wrong name, deliberately
  - text: "reads the evening's squabbles aloud at closing and hands out verdicts"
  - text: will not serve anyone who is still standing
  - text: 'props the door open with a different heavy object each day, and the regulars bet on which'
  - text: answers every question with another question
  - text: 'puts a pinch of salt on every table and watches who notices'
  - text: pours in silence and listens harder than anyone
  - text: consults the house cat before letting a stranger in
  - text: polishes the same cup whenever a question gets awkward
  - text: "takes a stranger's coat and keeps it on a peg until they have eaten"
  - text: keeps a shelf of odd boots left behind, each labelled with a date and a guess
  - text: never writes a price down and is somehow never wrong
  - text: hums when lying, which is why the regulars play along
  - text: 'keeps a spare room made up and charges the same whether or not anyone wants it'
  - text: moves guests to a new seat whenever they get comfortable, and blames the draught
  - text: pins unpaid tabs to a beam, where the regulars can read them
    tags: [debt]
  - text: turns the lamps down one notch for every raised voice
  - text: trades a bed for a good story, provided it has not been told in the house before
  - text: 'opens the shutters at noon exactly, whatever the weather'
  - text: takes off the apron only for travellers who bring news from the coast
  - text: 'sets a jug of water on every table before anyone asks, and takes the credit'
  - text: 'stamps the underside of every mug with the date it was last scrubbed'
  - text: counts heads in a whisper every time the door opens
  - text: 'tops up the lamp oil before the first guest arrives, always from the same unlabelled jar'
