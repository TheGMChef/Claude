    tags: [trade]
  - text: a retired magistrate who settles bar disputes with a coin toss
    safety: [police]
  - text: a netmaker knitting a net with one hole left deliberately
    tags: [coastal]
  - text: "a student questioning every guest about the town's oldest custom, then correcting the answers"
  - text: a trapper trading pelts for stew, the bundles stacked by the door
    tags: [wilderness]
    safety: [animal-harm]
  - text: a couple marking the anniversary of the day they first quarrelled here
