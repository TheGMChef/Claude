kind: table
id: fantasy.tavern.regular
title: Always in the corner
tags: [tavern]
entries:
  - text: a retired surveyor who taps each wall as he passes and frowns at the answer
    tags: [trade]
  - text: two sisters playing the same card game for nine years, the score never settled
    tags: [family]
  - text: a bard who only knows the second half of every song
  - text: a farmer who falls asleep upright and wakes exactly at closing
    tags: [rural]
  - text: a clerk copying the same page twice, and charging for both
    tags: [urban]
  - text: a woman who pays in exact coin and holds each one to the light, hunting for its twin
    tags: [trade]
  - text: 'a lurcher under the corner bench that is always fed first'
  - text: a courier waiting for a reply to a letter that was never going to come
    tags: [road]
  - text: two brothers who have not spoken since the harvest and still share a bench
    tags: [family]
  - text: a pedlar who sells nothing and rearranges his tray all evening
  - text: "a lay sister off duty, tallying the room's sins on a slate and rubbing them out unread"
    tags: [faith]
    safety: [religion]
  - text: a tinker mending the same pot while three people hand him better ones
  - text: a woman reading aloud from a book with half its pages gone, improving the rest
  - text: a pair of bargemen arguing over a river that has since changed course
    tags: [river]
  - text: 'an old soldier who sits facing the door and flinches at sudden laughter'
    safety: [war, mental-illness]
  - text: a young noble in borrowed boots, waiting to be recognised
    tags: [noble]
  - text: a piper with a cold, who plays anyway
  - text: a man laying small bets on who will walk through the door next
  - text: a physician who diagnoses strangers aloud and is sometimes right
  - text: three dyers with blue hands who tally the week in silence
