kind: table
id: fantasy.clue.delivery
title: The clue comes as
tags: [clue]
entries:
  - text: a receipt in the wrong pocket
  - text: a smell that should not be in this room
  - text: an eyewitness account that is exact about one detail and vague about the rest
  - text: a muddy print on a freshly swept floor
  - text: a dog that will not go past one door
  - text: a proverb quoted a little wrong by someone who knows better
  - text: a borrowed cloak returned cleaner than it left
  - text: a gift left at an empty house, with a note for someone else
  - text: a half-burnt scrap of paper rescued from the grate
    safety: [fire]
  - text: a coat hung to dry beside a cold hearth, still damp
  - text: a button sewn on with thread of a different colour
  - text: a glove left on a windowsill, still warm
  - text: a child's drawing with one grown-up too many in it
  - text: a caged bird repeating half a sentence it should not know
  - text: an invitation to dinner that arrives before the news does
  - text: a family brooch sold for far less than it is worth
    tags: [family, trade]
  - text: a last whisper through a door, half heard
    safety: [death]
  - text: a stain on the floorboards, scrubbed so hard the wood is pale
    safety: [violence]
  - text: a servant who answers every question with a question
  - text: a hush that falls over the room whenever one name comes up
  - text: a stack of unopened post, with one envelope slit
    tags: [urban]
  - text: a stray cat that follows one person around and hisses at another
  - text: footprints that stop at a wall and do not come back
  - text: a chair pulled up to a window that is nailed shut
  - text: a trail of spilled grain leading off the road
    tags: [rural, road]
  - text: a bundle of dried herbs hung over one door and no other
  - text: a pair of spectacles folded inside a book that no one reads
