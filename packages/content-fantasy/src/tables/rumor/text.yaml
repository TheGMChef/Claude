kind: table
id: fantasy.rumor.text
title: People say that
tags: [rumor]
entries:
  - text: the miller's new wheel turns even when the river is low
    tags: [river, rural]
  - text: '{ctx.front.name|or:a distant buyer} would pay silver for ordinary pebbles, sorted by colour'
    tags: [trade]
  - text: a stranger bought every candle for a day's ride around and paid in foreign silver
    tags: [trade]
  - text: the old cooper's hands have turned blue, and soap does nothing
    tags: [magic]
  - text: "{ctx.mention.name|or:a farmer's cousin} took a lantern to the old oak after dark, more than once"
    tags: [crime]
  - text: the well at the end of the lane has begun to hum at dusk
    tags: [rural]
  - text: a dog walked into the standing stones and came out wearing a silver collar
    tags: [rural, magic]
  - text: '{ctx.settlement.name|or:this place} first stood a mile east, and the old site still gets deliveries'
    tags: [ruin, trade]
  - text: a hermit in the hills has started buying paint in every colour
    tags: [mountain, wilderness]
  - text: the new landlord is collecting rent on houses that are not his
    tags: [crime]
  - text: the last priest to preach here left in the night with the collection
    tags: [faith, crime]
    safety: [religion]
  - text: '{ctx.front.name|or:a quiet buyer} bought the deeds to three farms in a single week'
    tags: [trade, rural]
  - text: a swimmer swears she saw something pale sink in the pool below the falls and not rise
    tags: [river]
    safety: [drowning, death]
  - text: a deserter from the last war is sleeping in the woodcutters' huts
    tags: [forest, crime]
    safety: [war, violence, death]
  - text: the old hall's windows light up on the first frost, though no one lives there
    tags: [ruin, noble]
  - text: a sickness is passing through the next valley, and travellers are being turned back
    tags: [road]
    safety: [death]
  - text: the sergeant of the watch is paid by both sides of a feud
    tags: [urban, crime]
    safety: [police]
  - text: a quiet circle meets in the quarry on moonless nights
    tags: [faith, magic]
    safety: [religion, violence]
  - text: a woodcutter found a web as wide as a barn door between two oaks
    tags: [forest]
    safety: [spiders]
  - text: the granary cats left in one night, and the rats did not
    tags: [rural]
    safety: [rats]
  - text: the tea from the hill farm makes people agreeable, then forgetful
    tags: [rural]
    safety: [addiction, mental-illness]
  - text: the road to the pass bends half a day further than it did last year
    tags: [road, mountain, magic]
  - text: a travelling painter is selling portraits that look like someone else
    tags: [road, magic]
  - text: '{ctx.mention.name|or:the widow at the crossroads} stopped speaking to everyone on the same day'
    tags: [family]
  - text: '{ctx.settlement.name|or:this place} used to have a second name, and an old rhyme still uses it'
  - text: '{ctx.front.name|or:a masked patron} paid students to memorise the same dull speech'
    tags: [trade, noble]
  - text: a closed coach passes every seventh night and never stops
    tags: [road]
  - text: the spring on the south hill has begun to run warm
    tags: [wilderness, magic]
  - text: someone has been quietly pacing out the common for a buyer
    tags: [noble, trade]
  - text: the founder's statue was turned to face the wall last night
    tags: [urban]
  - text: an inspector is coming to decide which places keep their market days
    tags: [noble]
  - text: a trader from the coast has cornered the supply of nails and is waiting for winter
    tags: [coastal, trade]
  - text: the herbwife has started refusing payment from anyone with a certain surname
    tags: [family]
  - text: something large has been rubbing against the trees along the north ridge
    tags: [forest, wilderness]
  - text: the river changed course in the night and left an old wall standing in the mud
    tags: [river, ruin]
  - text: a hazel sapling sprouted overnight in the middle of the main road
    tags: [rural, magic]
  - text: a troupe has been seen rehearsing the same scene at a different crossroads each night
    tags: [road]
  - text: a stranger has paid for three beds and sleeps in none
  - text: a retired pilot who knows the old channel is being hunted by two rival captains
    tags: [coastal]
  - text: the scarecrow in the east field is facing a different way every morning
    tags: [rural, magic]
