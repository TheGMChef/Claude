kind: table
id: fantasy.treasure.hook
title: But
tags: [loot]
entries:
  - text: its last owner wants it back and knows who has it
  - text: a merchant's records list it as already sold, to someone who has not paid
    tags: [trade]
  - text: every dealer in the region has been told to watch for it
    tags: [crime]
  - text: a collector wants it badly, and the reason changes each time they explain
    tags: [trade]
  - text: a scholar has been asking after exactly this, and will pay double to learn where it was found
  - text: the family who lost it are still in town, and they are not rich
    tags: [family]
  - text: it was lent as surety for a loan, and the lender is already asking
    tags: [debt]
  - text: someone needs it by the end of the week and will not say why
  - text: whoever hid it left word of the one person who must never see it
  - text: two cousins each hold a deed that says it is theirs
    tags: [family, noble]
  - text: a forger swears it is one of theirs, and can prove it
    tags: [crime]
  - text: the village is certain it belongs to the village
    tags: [rural]
  - text: every previous owner sold it within a month, for less than they paid
    tags: [magic]
  - text: a polite shadow follows whoever carries it, and never gets closer
    tags: [crime]
  - text: it is far too recognisable to sell anywhere in this country
    tags: [crime]
  - text: the baker two doors down needs it to meet a quarter's rent, and has said nothing
    tags: [urban, debt]
  - text: a second party is already on the way, with a better claim on paper
  - text: it has begun to draw odd weather to wherever it is kept
    tags: [magic]
  - text: the only buyer with the money is hiding from someone
    tags: [trade, crime]
  - text: the best offer on the table expires at dusk tomorrow
    tags: [trade]
  - text: selling it would ruin the only honest broker in the district
    tags: [trade]
  - text: whoever holds it for long dreams of the same corridor
    tags: [magic]
  - text: it leaves a scent on the carrier that lingers for days
  - text: it must be declared before sunset, and declaring it means answering questions
    tags: [trade, crime]
