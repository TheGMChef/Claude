kind: table
id: fantasy.settlement.trouble
title: What is going wrong
tags: [settlement]
entries:
  - text: the well water has gone sweet and nobody will say who first noticed
    tags: [rural]
  - text: two families both hold a deed to the same meadow, signed by the same obliging clerk
    tags: [family, noble]
  - text: the grain-tax clerk arrived early and has not left
    tags: [rural]
  - text: the road toll has doubled overnight, and nobody can find the order that did it
    tags: [road]
  - text: half the shopkeepers have stopped speaking to the other half over a stolen hat
    tags: [urban]
  - text: everyone has begun dreaming the same unlit orchard, and nobody will describe it
    tags: [magic]
    safety: [mental-illness]
  - text: the winter stores were counted twice and came out different both times
    tags: [rural, crime]
  - text: the harvest festival has been cancelled by a committee that will not say who sits on it
    tags: [rural]
  - text: a stranger has quietly paid off half the debts here and has not yet named a price
    tags: [debt]
  - text: the night watch has put down its lanterns until someone settles the matter of boots
    tags: [urban]
    safety: [police]
  - text: the only baker has retired, and three cousins are arguing over who takes over the oven
    tags: [urban, family]
  - text: someone is buying every empty building on the main street through three different agents
    tags: [urban, trade]
  - text: "the river shifted course in the night and now runs through the neighbour's field"
    tags: [river, rural]
  - text: a neighbouring settlement has built a perfect copy of the assembly hall and calls it the original
    tags: [urban, trade]
  - text: the cistern stands lower every morning than the records say, and the water-carriers are suddenly well off
    tags: [urban]
  - text: a lost heir has been announced for the manor, and four people have arrived claiming the title
    tags: [noble]
    safety: [death]
  - text: a hard frost has ruined the late crop and every farm suspects the next of hoarding seed
    tags: [rural]
  - text: a travelling troupe has outstayed its welcome, and everyone is too polite to say so
    tags: [road]
  - text: the census lists forty residents nobody has ever met
    tags: [urban, crime]
  - text: the new gatekeeper is honest, and the smugglers cannot stand it
    tags: [road, crime]
  - text: the autumn draw for the best stall pitch was held twice, with two different winners
    tags: [urban]
  - text: a landslip has cut the road, and someone is charging to carry goods over it
    tags: [mountain, road]
  - text: someone has altered the posted tide table, and three boats have already missed the morning water
    tags: [coastal]
    safety: [drowning]
  - text: "someone moves the market pitch markers a hand's width every night"
    tags: [urban]
  - text: a pedlar has sold one cart-load of genuine rain-charms to every household and left on the early road
    tags: [road, crime]
  - text: a quarrel over the best-kept garden prize has dragged in the whole lane
    tags: [rural]
  - text: a quiet new arrival has been invited to every house but one, and nobody will say why
    tags: [urban]
  - text: the visiting traders arrived a fortnight early and there is nowhere for them to sleep
    tags: [road, trade]
  - text: unsigned letters of apology keep appearing on doorsteps, and everyone wonders what they are apologising for
    tags: [urban]
  - text: the new schoolteacher teaches a version of local history that three families dispute
    tags: [urban, family]
