kind: table
id: fantasy.shop.haggle
title: If you haggle
tags:
  - shop
entries:
  - text: a good story knocks the price down, and the keeper pretends not to enjoy it
  - text: offers are accepted only in rhyme
  - text: the keeper never lowers a price but throws in something odd
  - text: the price drops the moment a customer turns toward the door
  - text: trade is by weight only, never by the coin's face
  - text: anyone who admits what they really came for pays half
  - text: no haggling is allowed before noon, and the sun is checked
  - text: a customer who haggles badly gets a lecture, then a discount anyway
  - text: a regular has to vouch for newcomers first, and charges a finder's fee
  - text: the keeper drums fingers on the counter, and the drumming is the offer
  - text: the keeper starts at a ruinous price and waits to be insulted
  - text: mentioning a rival in passing takes a coin off
  - text: anything can be swapped for anything, once it has been valued aloud
  - text: every concession must be matched by one from the customer, in public
  - text: the keeper's grandchild whispers the real floor price from under the counter
  - text: a favour owed is taken in place of coin, and written down
    tags: [debt]
  - text: the final price is settled by a single hand of cards from the keeper's deck
  - text: paying the first price asked earns a free gift and a worried look
  - text: customers who bring their own wrapping pay less
  - text: waiting in silence long enough makes the keeper lower the price unprompted
