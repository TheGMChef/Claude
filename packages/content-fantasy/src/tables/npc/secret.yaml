kind: table
id: fantasy.npc.secret
title: What they are hiding
tags: [npc]
entries:
  - text: they forged the deed to the house they live in
    tags: [crime]
  - text: they write the anonymous broadsheets mocking the council
    tags: [urban]
  - text: they quietly own the moneylender everyone else is afraid of
    tags: [debt]
  - text: their husband, who "left for the coast" years ago, keeps a second family two towns over
    tags: [family]
  - text: they saw who set the warehouse fire and were paid to forget
    tags: [crime]
    safety: [fire]
  - text: they can't read, and have bluffed through every contract
  - text: they fenced goods for the bandit crew that now has a bounty on it
    tags: [crime]
    safety: [police]
  - text: they are quietly in love with their employer's spouse
  - text: the relic they guard is a painted copy; they sold the real one
    tags: [faith, trade]
    safety: [religion]
  - text: they have read their neighbours' letters for years
  - text: they carry the signet ring of the noble who fathered them
    tags: [noble, family]
  - text: they started the curse rumour to keep buyers away from the old mill
    tags: [rural, magic]
  - text: they stopped believing in the god they still preach for
    tags: [faith]
    safety: [religion]
  - text: they sell gossip to both sides of the dockside feud
    tags: [urban, coastal, crime]
  - text: their memory is slipping, and they keep notes in their boots
    safety: [mental-illness]
  - text: they deserted from the army under a borrowed name
    safety: [war]
  - text: the river spirit they bargained with comes to collect every spring
    tags: [magic, wilderness]
  - text: their shop is the front door of a smuggling ring
    tags: [coastal, crime]
  - text: they won their post in a card game, not on merit
  - text: they kept a copy of every key they ever cut
    tags: [urban, crime]
