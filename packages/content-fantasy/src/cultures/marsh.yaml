kind: culture
id: fantasy.culture.marsh
name: Marsh-folk
genre: fantasy
voice:
  summary: slow vowels, drop the final g, never says no
  tips:
    - Stretch the vowels; nobody out here hurries.
    - 'Refuse sideways: "tide''s not right for that."'
    - 'Swear by the water: "by the low tide", "mud take it".'
    - 'Give directions by landmarks that move: "left at the heron, if it''s there."'
names:
  # Open start syllable + optional consonant-vowel middle + consonant-initial end, so every join is
  # vowel-then-consonant and a name never piles up consonants or vowels (D41).
  given:
    pattern: [start, mid?:0.15, end]
    parts:
      start: [O, Elo, Ta, We, Me, Fe, Lo, Ne, Sa, Ha, Ro, Be, Mo, Vi, Nu, Lu]
      mid: [la, ne, ri, lo, se, wa]
      end:
        [drin, lin, sin, row, na, wen, thel, lith, wyn, ra, mon, bel, rey, ren, rin, ssa, lla, nel]
  family:
    pattern: [start, end]
    parts:
      start: [Vey, Mer, Fen, Brack, Sal, Wil, Mose, Tull, Hale, Sedge, Lun, Rill, Moor, Mare]
      end: ['', wick, by, mere, ling, low, water, wade]
  format: '{given} {family}'
  examples:
    - Odrin Vey
    - Ilsa Merrow
    - Tamsin Fenwick
    - Wenna Brack
    - Elowen Reedby
    - Ulla Mosling
    - Nessa Tullow
    - Orrin Salmere
    - Belwyn Sedgewater
    - Mowen Rillmere
    - Sellen Rillwick
    - Lorin Mosling
    - Neleth Hale
    - Telna Sallow
    - Fenlie Mareby
    - Roslin Lunwater
  exampleChance: 0.25
  # Keep marsh names soft: no consonant pile-ups or y-glides in the given name, no stutters.
  banned:
    [
      '(.)\1\1',
      '^.{0,2}$',
      'aa',
      'ii',
      'uu',
      '[qxz]',
      'ww',
      'yw',
      '^\S*[^aeiouy\s]{3}',
      '^\S*y[aeiou]',
      '(\w{2,3})\1',
      '^(\w{3})\w*\s+\1',
      '(\w{3})\s+\w*\1$',
    ]
