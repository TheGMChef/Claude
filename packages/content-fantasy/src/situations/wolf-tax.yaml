kind: situation
id: fantasy.situation.wolf-tax
title: Wolf tax
summary: Pass villages pay in mutton to keep a wolf pack off the road, and this year's payment never reached the cairn.
tags: [situation, mountain, wilderness]
safety: []
facets:
  enemy:
    - text: a drover who took the payment to feed his own flock and hopes the wolves get blamed
    - text: a pelt-buyer from the lowlands who has paid for twenty wolf skins and means to collect
      tags: [trade]
      safety: [animal-harm]
    - text: a village headwoman who wants to stop paying and already has the votes
    - text: a brigand captain who offers to keep the road clear for a smaller fee
      tags: [crime]
  friend:
    - text: an old woman who has hauled her village's share up the pass for forty years and never seen a wolf
    - text: a mule-driver who counts the pack every dusk and swears it is moving off
      safety: [animal-harm]
      tags: [road]
    - text: a lowland naturalist whose notes show the pack drifting north year by year
      safety: [animal-harm]
    - text: a waystation cook who shares scraps with the pack at the back step
  complication:
    - text: the pack really is the reason no brigands work this pass
      tags: [crime]
    - text: the payment is a whole family's living, and they quietly sell half of it
      tags: [family]
    - text: every village pays a different share, and each swears theirs is the fair one
    - text: the highest village has the least to give and the most to lose
  thing:
    - text: a horn whistle carved with marks the pack seems to answer
    - text: an iron pot too heavy to steal, found empty at the cairn
    - text: a wolf-skin cloak that fits nobody comfortably and is worn by whoever collects
      safety: [animal-harm]
    - text: a lame mule that came down the pass alone, still carrying half the payment
  place:
    - text: the cairn at the head of the pass, where the payment is stacked
    - text: a shepherds' hut with fresh tracks circling it
    - text: a waystation kitchen, warm, crowded and loud with travellers' news
      tags: [road]
    - text: a lowland sheep-pen where the pass villages sell what is left
      tags: [trade]
  pressure:
    - text: when the first snow falls the pack comes down to the cairn and finds it bare
    - text: at the autumn gathering the villages vote to stop paying, or to pay triple
    - text: by midwinter the highest village is out of mutton and starts to leave
      tags: [family]
    - text: at the spring drive the flocks must cross the pass, paid up or not
      tags: [rural]
