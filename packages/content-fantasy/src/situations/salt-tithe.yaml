kind: situation
id: fantasy.situation.salt-tithe
title: Salt levy
summary: A powerful house takes a cut of the salt everyone needs to live.
tags: [situation, coastal, trade]
safety: []
facets:
  enemy:
    - text: a levy-assessor who rounds every sack up and keeps the difference
    - text: the house steward, who wants the salt-pans enclosed by spring
      tags: [noble]
    - text: a smuggler who profits from the levy and wants it kept
      tags: [crime]
    - text: a steward's nephew, eager to prove the levy can be raised
      tags: [noble]
  friend:
    - text: a retired salt-boiler who knows which scales are crooked
    - text: a cooper who wants an honest weight for his barrels
    - text: the harbourmaster's niece, who keeps her own count of every sack
    - text: a fishing family who cannot cure their catch without cheap salt
      tags: [family]
  complication:
    - text: the levy pays for the harbour upkeep, and nobody else will
    - text: half the boilers already owe the house money
      tags: [debt]
    - text: only the house's collectors are allowed to handle the scales
    - text: the boilers have been cutting their salt with sand to make the weight
  thing:
    - text: an honest set of brass scales, wrapped in oilcloth
    - text: a salt-boiler's iron pan, stamped with a much older measure
    - text: a half-blind mule that walks straight to a sea cave every evening
    - text: a wagon-load of salt that dodged the levy, hidden under drying nets
      tags: [crime]
  place:
    - text: the boiling sheds, where nobody can hear a word over the pans
    - text: a quay shed where sacks are stacked to be assessed, open one day a week
    - text: a sea cave where sacks are stacked above the tide line
      tags: [underground, crime]
    - text: the house's counting room, above the coach house
  pressure:
    - text: at the next new moon the levy doubles, and the collectors bring a longer list
    - text: by the autumn catch, families start leaving for the next bay
      tags: [family]
    - text: when the frost comes, the boilers sell their pans to the house at half price
    - text: before the fair, someone will set fire to the quay shed
      safety: [fire]
