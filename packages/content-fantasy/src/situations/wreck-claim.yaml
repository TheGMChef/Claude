kind: situation
id: fantasy.situation.wreck-claim
title: Wreck claim
summary: A merchant ship broke on the rocks, and three parties say the cargo is theirs.
tags: [situation, coastal, trade]
safety: [drowning]
facets:
  enemy:
    - text: an underwriter who needs it proven that the wreck was no accident
    - text: a village headwoman who says custom gives the shore whatever it catches
      tags: [rural]
    - text: a harbour pilot who moved the channel markers an hour before the storm
      tags: [crime]
      safety: [death]
    - text: a shipowner's brother who wants the cargo lost and the family debt cancelled
      tags: [debt, family]
  friend:
    - text: a ship's cook who walked ashore with a salvaged sea chest and an unwilling story
    - text: a tide-reader who can say exactly when the wreck will be reachable
    - text: a net-mender who found something strange in the wreckage and keeps it from the village
    - text: a notary who knows the salvage law and wishes somebody would ask
      tags: [urban]
  complication:
    - text: a third of the crates are far heavier than their label, and opening one voids the insurance
    - text: the wreck lies in two parishes, and each wants to be the one that claims it
    - text: the cargo was insured twice by two firms, each sure the other is liable
    - text: tide and law agree for only two hours a day, and everyone knows it
  thing:
    - text: a strongbox wedged in the rocks beneath the stern
    - text: a ship's log, water-stained, with the last three entries in a different hand
    - text: a crate of porcelain with every cup wrapped in love letters
    - text: a split figurehead with something rattling inside
  place:
    - text: the rock shelf where the wreck lies, reachable only at low tide
    - text: a boathouse stacked to the rafters with damp crates
    - text: a harbour office where the salvage forms are three weeks behind
      tags: [urban]
    - text: the cove where the last crates washed up, guarded by gulls and ankle-deep in weed
  pressure:
    - text: at the next spring tide the wreck breaks up and takes the cargo with it
    - text: by the end of the month the insurers send their own inspectors to count every crate
    - text: at the weekend the shipowner's creditors arrive to bid on whatever has been landed
      tags: [debt]
    - text: when the survivors reach port with their own account, every story will have to match
