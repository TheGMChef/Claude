kind: situation
id: fantasy.situation.stolen-weather
title: Stolen weather
summary: Someone has bottled the rain, and the valley is drying out.
tags: [situation, magic, rural]
safety: []
facets:
  enemy:
    - text: a weather-witch who sells rain by the barrel to anyone with coin
      tags: [trade]
    - text: a landowner who wants his neighbours dry so he can buy their fields
    - text: a travelling showman whose jars of storm are the real thing
    - text: the river-folk downstream, who say the rain was always theirs
      tags: [river]
  friend:
    - text: an almanac-maker whose predictions have all gone wrong
    - text: a well-digger who knows where water still runs below ground
      tags: [underground]
    - text: a goatherd who saw the jars being filled up on the ridge
      tags: [mountain]
    - text: a weather-witch's apprentice, who never agreed to any of this
  complication:
    - text: the rain was taken from a valley that had too much of it
    - text: opening the jars needs a word only the thief knows
    - text: the buyers have already paid, and they are not patient people
    - text: the village elders once traded something to a witch for good harvests, and never said what
  thing:
    - text: a stoppered jar that sloshes and rumbles like distant thunder
    - text: a weathervane that points to wherever the rain is hidden
    - text: a rain barrel that fills every night with water from somewhere else
      tags: [trade]
    - text: a cloak that is always wet, even in full sun
  place:
    - text: the cracked reservoir above the village, empty for the first time
    - text: a root store lined with shelves of humming jars
      tags: [underground]
    - text: the hilltop where clouds gather every night and never break
      tags: [mountain]
    - text: the dry riverbed, where the old stepping-stones are carved with signs
      tags: [river]
  pressure:
    - text: by midsummer the wells fail and the herds are sold off cheap
    - text: at the next full moon the autumn rain is sold as well
    - text: when the harvest fails, someone with ready money buys the valley at a quarter of its worth
    - text: before the month is out, the dry grass will catch and burn
      safety: [fire]
