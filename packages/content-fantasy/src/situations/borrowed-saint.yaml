kind: situation
id: fantasy.situation.borrowed-saint
title: Borrowed saint
summary: A chapel borrowed a revered saint's carving to draw pilgrims, and its owners want it back.
tags: [situation, faith, road]
safety: [religion]
facets:
  enemy:
    - text: a proctor from the lending abbey, who has a signed receipt and no sense of humour
    - text: the chapel's treasurer, who wants a copy made and the original kept
    - text: a rival shrine's keeper, who would like the carving to fail in public
    - text: a pilgrim-captain who has told hundreds that the saint chose to stay
  friend:
    - text: a woodcarver's widow who knows exactly how old the carving really is
    - text: the abbey's lay-sister, who wants it home but not the proctor's way
    - text: a pilgrim who swears the carving cured her and will not see it moved
    - text: the chapel sweeper, who noticed the carving's left hand has changed
  complication:
    - text: the carving draws crowds the chapel cannot feed or house
    - text: the abbey's records call the loan a gift, and the proctor's papers call it a lease
    - text: the copy in the nave is better loved than the original, which has gone missing
    - text: the pilgrims' offerings are what keep the chapel roof on
  thing:
    - text: the carving itself, knee-high, with a chip missing from the hem
    - text: the loan receipt, signed in a hand the abbey says is not theirs
    - text: a hollow in the carving's base that held something now gone
    - text: the book of petitions, with six names crossed out
  place:
    - text: the side chapel, rearranged each week to fit a bigger crowd
    - text: the pilgrims' camp at the crossroads, with its own rules and its own cook
    - text: the abbey workshop, where the copy was carved and the shavings still lie
    - text: a drovers' rest on the pilgrim road, where the carving spent a night unattended
      tags: [rural]
  pressure:
    - text: on the saint's feast day the abbey comes in person, and so does the crowd
    - text: before the roads close for winter the proctor takes it back, or the loan renews at a price
    - text: when the pilgrims learn about the copy, the offerings stop and the mood turns
    - text: by the new year the roof beams give out unless the offerings keep coming
