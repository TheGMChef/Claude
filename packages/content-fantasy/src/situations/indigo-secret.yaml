kind: situation
id: fantasy.situation.indigo-secret
title: Indigo secret
summary: A family dye-works makes the only true blue in the valley, and the one who knew the method is leaving.
tags: [situation, river, family]
safety: []
facets:
  enemy:
    - text: a cousin who married into a rival dye-house and brought half the method with her
      tags: [trade]
    - text: a mill owner upstream whose runoff has begun to foul the vats
    - text: a draper who wants the blue to himself and will buy out the whole family to get it
      tags: [trade]
    - text: an uncle who would rather sell the works than see his brothers run it
  friend:
    - text: a vat hand who has stirred the blue for twenty years without being told the method
    - text: a weaver who needs the blue for a commission that will make her name
      tags: [trade]
    - text: a river-keeper who keeps the channel clear and wants the dye-works to thrive
    - text: an aunt who writes recipes in a private shorthand and pretends not to be able to read it
  complication:
    - text: the blue depends on a river reed that grows along only one stretch of bank
    - text: the old method is part superstition, and nobody knows which part
    - text: every vat comes out slightly different, and relatives cannot agree which to copy
    - text: an old covenant forbids any dyeing after dusk, and the busiest season is here
      tags: [noble]
  thing:
    - text: a stoneware pot of indigo paste, fermented for three generations
    - text: a stirring paddle worn narrow on one side, with initials carved in the handle
    - text: a bolt of cloth dyed a blue nobody can now reproduce
    - text: a bundle of dried river reed tied with blue thread
  place:
    - text: a dyeing floor with six vats, every wall stained to shoulder height
    - text: a riverbank field where blue cloth flaps on long lines
    - text: a weir pool where the water runs three colours by afternoon
    - text: a kitchen table where relatives settle their quarrels
  pressure:
    - text: before the autumn orders, one vat must be matched or the biggest buyer walks away
      tags: [trade]
    - text: when river reed flowers, the harvest window closes for the year
    - text: at the next family meeting the works goes to a vote, and the votes are not yet counted
    - text: by the end of the month the dyer who knows the method leaves for good, taking her apprentices with her
