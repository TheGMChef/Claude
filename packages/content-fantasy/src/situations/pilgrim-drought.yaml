kind: situation
id: fantasy.situation.pilgrim-drought
title: Pilgrim drought
summary: Pilgrims have stopped walking the shrine road, and the towns that lived on their purses are starting to panic.
tags: [situation, road]
safety: [religion]
facets:
  enemy:
    - text: a road contractor who was paid to mend the route and pocketed the money
      tags: [crime]
    - text: an innkeeper who pays strangers to walk the road in grey cloaks, to keep up appearances
      tags: [trade]
    - text: a mayor who has borrowed against next year's pilgrim crowds
      tags: [debt]
    - text: a relic-seller who can prove nothing and sells hope by the pound
      tags: [trade]
  friend:
    - text: a hospitaller who kept the rest-houses stocked and now counts every loaf
    - text: a pilgrim who walked anyway and wants to know why the road is empty
    - text: a pair of musicians who earn their bread from pilgrims' songs
    - text: a young novice sent to find out what went wrong, with no money for the trip
  complication:
    - text: the road is perfectly open, and nobody can say why the pilgrims stopped
    - text: a story says the blessing has run out, and no one knows who first told it
    - text: the shrine's keepers are forbidden to ask anyone to come
    - text: the only guidebooks in circulation describe a different, shorter route
      tags: [trade]
  thing:
    - text: a battered travelling drum that once set the walking pace for a whole company
    - text: a worn stone at the first milestone, touched for luck and now split in two
    - text: a jar of road-dust said to carry a blessing
    - text: a basket of unsold clay badges stamped with a shrine gate
      tags: [trade]
  place:
    - text: a rest-house with forty empty beds and a full pantry
    - text: a market-town inn yard with a tally board of pilgrim numbers, last year's rubbed faint
    - text: a ridge where pilgrims once caught their first glimpse of the shrine
    - text: a ford where pilgrims once washed their feet, now weedy and silent
  pressure:
    - text: by midsummer the high rest-houses close for the season and the road goes quiet for good
    - text: before harvest the road-menders are laid off, and the first washout goes unmended
    - text: in a month a second pilgrimage opens elsewhere, and the road's last travellers turn away
    - text: at the autumn gathering the shrine's keepers must decide whether to send runners out to find the pilgrims
