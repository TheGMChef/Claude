kind: situation
id: fantasy.situation.uncovered-hall
title: Uncovered hall
summary: A landslide has opened a vaulted hall in the hillside, and every salvage crew in three valleys is on the road.
tags: [situation, ruin, wilderness]
safety: []
facets:
  enemy:
    - text: a salvage master with twenty paid hands and no interest in sharing
      tags: [trade]
    - text: an estate agent who says everything under the hill belongs to his lord
      tags: [noble]
    - text: a scholar who wants the hall left exactly as found and will bribe to make it so
    - text: a quarry owner whose cutting set off the slide and would like it filled in
  friend:
    - text: a goat-keeper who has known the hillside's hollows since youth and was never asked
    - text: a stonemason who recognises the carving style and is fascinated
    - text: a young digger who has already been inside and says almost nothing
    - text: a diviner who promises to find the safest way in, for a fee
      tags: [magic]
  complication:
    - text: the roof is still settling, and the arches creak at every footstep
    - text: the hillside lies in three parishes, and none agrees where the line runs
      tags: [rural]
    - text: by local custom a find belongs to whoever's tools touch it first
    - text: the carvings inside are fragile, and heavy tools ruin them
  thing:
    - text: a stone basin carved with a procession of animals
    - text: a mosaic floor, half under rubble, with a single panel already lifted
    - text: a bronze hinge as long as a man's arm
    - text: a stack of oilcloth bundles someone has already taken out and hidden in the heather
      tags: [crime]
  place:
    - text: a vaulted hall with daylight spilling through the new hole
    - text: a diggers' camp of borrowed tents, built in a hurry
    - text: a hillside track newly widened by passing wagons
      tags: [road]
    - text: a stream gully running ochre with the slide's clay
  pressure:
    - text: at the next heavy downpour the slope slips again and seals the only way in
    - text: within a week a rival crew arrives with proper winches and drives out the rest
    - text: when the harvest ends, farmhands arrive in hundreds, hungry for work and willing to dig
      tags: [rural]
    - text: at the first frost the salvage crews go home, and someone will strip the hall unwatched
      tags: [crime]
