kind: situation
id: fantasy.situation.long-masquerade
title: Long masquerade
summary: A festival of masks has run for nine days, and the rules forbid unmasking before the contest is settled.
tags: [situation, urban, noble]
safety: []
facets:
  enemy:
    - text: a masked noble who uses the festival's anonymity to say what he could never say bare-faced
    - text: a master maskmaker who wants the festival prolonged because sales are brisk
      tags: [trade]
    - text: a festival warden who fines anyone caught with a bare face
    - text: someone in a copy of a duchess's mask, giving orders in her name
      tags: [crime]
  friend:
    - text: a stilt-walker who sees over every crowd and has recognised more than one face
    - text: a street poet who rhymes the festival's secrets at dusk
    - text: a contest judge who has no idea who is winning and desperately wants it over
    - text: a journeyman on the wrong side of his master, hiding inside a stolen costume
  complication:
    - text: no one may be named while masked, so accusations must be made by description
    - text: half the masks are rented, and the rental records got mixed up
    - text: festival law forbids leaving town masked and forbids unmasking, so the gates are jammed
    - text: the contest goes to whoever stays unrecognised longest, and some of them are cheating
  thing:
    - text: a mask of pale glazed clay that three different people have lost this week
    - text: a rented mask with someone else's face-paint still inside
    - text: a crown of paper laurel that fits only one head in town
    - text: a pair of identical masks worn by two people who are not related
  place:
    - text: a ballroom in the old dye-works, where the floor is stained blue
    - text: a maskmaker's attic, a forest of faces on pegs
    - text: a covered arcade where nobody can say who came in or went out
    - text: the city gate, where a queue of the masked argues with the gatekeeper
      tags: [road]
  pressure:
    - text: on the tenth night a winner is crowned and everyone must unmask at once
    - text: by the weekend the stalls close, because nobody can sign for goods
      tags: [trade]
    - text: if it rains on the ninth night the dye runs and every secret face shows at once
    - text: before the final night someone will slip away with the winner's jewelled mask, worth a street
      tags: [crime]
