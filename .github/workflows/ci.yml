name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Least privilege: read the code, nothing else. No job needs a token with write access or a secret.
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (docs/security.md); Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on any unwaived moderate or worse advisory)
        run: pnpm audit --audit-level moderate
      - name: Production dependency licenses (allowlist in scripts/licenses.mjs)
        run: node scripts/licenses.mjs --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Engine coverage (lines, statements, functions >= 90%)
        run: pnpm test:coverage
      - name: Engine benchmark (soft targets, reported only)
        continue-on-error: true
        run: pnpm --filter @prepdesk/engine bench --run
      - run: pnpm content:lint
      - run: pnpm build
      - name: Build steps must not modify tracked files
        run: test -z "$(git status --porcelain)" || (git status --porcelain && exit 1)
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e --trace off
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
