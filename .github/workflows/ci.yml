name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Least privilege: read the code, nothing else. No job needs a token with write access or a secret.
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (docs/security.md); Dependabot bumps them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on any unwaived moderate or worse advisory)
        run: pnpm audit --audit-level moderate
      - name: Production dependency licenses (allowlist in scripts/licenses.mjs)
        run: node scripts/licenses.mjs --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Engine coverage (lines, statements, functions >= 90%)
        run: pnpm test:coverage
      - name: Engine benchmark (soft targets, reported only)
        continue-on-error: true
        run: pnpm --filter @prepdesk/engine bench --run
      - run: pnpm content:lint
      - run: pnpm build
      - name: Build steps must not modify tracked files
        run: test -z "$(git status --porcelain)" || (git status --porcelain && exit 1)
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e --trace off
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
