name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on any unwaived moderate or worse advisory)
        run: pnpm audit --audit-level moderate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Engine coverage (lines, statements, functions >= 90%)
        run: pnpm test:coverage
      - name: Engine benchmark (soft targets, reported only)
        continue-on-error: true
        run: pnpm --filter @prepdesk/engine bench --run
      - run: pnpm content:lint
      - run: pnpm build
      - name: Build steps must not modify tracked files
        run: test -z "$(git status --porcelain)" || (git status --porcelain && exit 1)
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
